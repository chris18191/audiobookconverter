name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # Three steps instead of one: when this fails, the run has to say whether the
    # login, the build or the push was the problem. The password goes in over
    # stdin so the token does not appear in the process list of the runner.
    - name: Log in to ghcr.io
      run: echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u "${{ secrets.GH_USER }}" --password-stdin
    - name: Build the Docker image
      run: docker build . --tag ghcr.io/${{ secrets.GH_USER }}/audiobookconverter:latest
    - name: Push the Docker image
      run: docker push ghcr.io/${{ secrets.GH_USER }}/audiobookconverter:latest
